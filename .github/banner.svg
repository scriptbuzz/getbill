<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">getBill v0.1.0-alpha.15</title>
  <desc id="d">getBill turns AWS CUR 2.0 billing files in Amazon S3 into Excel workbooks. CSV or Parquet files in S3 go to getBill on your computer, which writes Excel workbooks back to S3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2636"/>
      <stop offset="1" stop-color="#0E141C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF9900"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect x="50" y="44" width="96" height="6" rx="3" fill="#FF9900"/>

  <text id="title" x="50" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#F2F4F7">getBill</text>
  <rect id="pill" x="300" y="82" width="200" height="40" rx="20" fill="none" stroke="#FF9900" stroke-width="2"/>
  <text id="pill-text" x="400" y="109" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#FF9900">v0.1.0-alpha.15</text>

  <text id="tagline" x="50" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#B8C3D0">Turns AWS CUR 2.0 billing files in Amazon S3 into Excel workbooks.</text>

  <rect id="box1" x="50" y="218" width="320" height="64" rx="12" fill="#232F3E" stroke="#3D4B5C" stroke-width="1.5"/>
  <text id="box1-text" x="210" y="257" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F2F4F7">CSV or Parquet in S3</text>

  <path d="M378,250 H432" stroke="#FF9900" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect id="box2" x="440" y="218" width="320" height="64" rx="12" fill="#2B2416" stroke="#FF9900" stroke-width="2"/>
  <text id="box2-text" x="600" y="257" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFD9A0">getBill on your computer</text>

  <path d="M768,250 H822" stroke="#FF9900" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect id="box3" x="830" y="218" width="320" height="64" rx="12" fill="#232F3E" stroke="#3D4B5C" stroke-width="1.5"/>
  <text id="box3-text" x="990" y="257" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#F2F4F7">Excel workbooks in S3</text>
</svg>
