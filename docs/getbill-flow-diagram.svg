<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1580" width="1040" height="1580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the getBill demo works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .step { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .question { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .answer { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .account { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .bucket { fill: #ffffff; stroke: #f97316; stroke-width: 1.2; }
      .folder { fill: #fefce8; stroke: #ca8a04; stroke-width: 1; }
      .chip { fill: #ffffff; stroke: #a8a29e; stroke-width: 1; }
      .loop { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .line { fill: none; stroke: #475569; stroke-width: 1.5; }
      .data { fill: none; stroke: #ea580c; stroke-width: 1.8; }
      .t { font-size: 14px; fill: #0f172a; }
      .ts { font-size: 13px; fill: #0f172a; }
      .note { font-size: 12.5px; fill: #475569; }
      .h { font-size: 15px; font-weight: 600; fill: #9a3412; }
      .hb { font-size: 14px; font-weight: 600; fill: #7c2d12; }
      .section { font-size: 12px; font-weight: 600; fill: #64748b; letter-spacing: 0.06em; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1c1917; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="1580" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">How the getBill demo works</text>
  <text id="last-modified" x="40" y="68" class="note" font-style="italic">Last modified: 2026-11-19 14:27 EST. Version: 0.1.0-alpha.23.</text>

  <!-- ================= Left column: the steps ================= -->
  <text x="40" y="106" class="section">PREPARE THE TEST DATA</text>

  <rect id="s1" class="step" x="40" y="116" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="142">1. You prepare a CUR 2.0 file in the format that<tspan x="56" dy="20">AWS Data Exports uses, as either CSV or Parquet.</tspan></text>
  <path class="line" d="M280,180 V202" marker-end="url(#arrow)"/>

  <rect id="s2" class="step" x="40" y="204" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="230">2. You upload the file to the source folder<tspan x="56" dy="20">with the aws s3 cp command.</tspan></text>

  <text x="40" y="294" class="section">RUN THE TOOL</text>

  <rect id="s3" class="step" x="40" y="304" width="480" height="44" rx="8"/>
  <text class="t" x="56" y="331">3. You start getbill in a terminal.</text>
  <path class="line" d="M280,348 V370" marker-end="url(#arrow)"/>

  <rect id="s4" class="step" x="40" y="372" width="480" height="104" rx="8"/>
  <text class="t" x="56" y="398">4. You pick the source profile. AWS STS confirms<tspan x="56" dy="20">which account and identity the profile signs in to.</tspan><tspan x="56" dy="20">When an SSO sign-in has expired, the tool shows</tspan><tspan x="56" dy="20">the login command and lets you try again.</tspan></text>
  <path class="line" d="M280,476 V498" marker-end="url(#arrow)"/>

  <rect id="s5" class="step" x="40" y="500" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="526">5. You pick the source bucket and folder. The tool<tspan x="56" dy="20">lists the CSV and Parquet files in that folder.</tspan></text>
  <path class="line" d="M280,564 V586" marker-end="url(#arrow)"/>

  <rect id="s6" class="step" x="40" y="588" width="480" height="44" rx="8"/>
  <text class="t" x="56" y="615">6. You choose which files to convert.</text>
  <path class="line" d="M280,632 V654" marker-end="url(#arrow)"/>

  <rect id="q7" class="question" x="40" y="656" width="480" height="44" rx="8"/>
  <text class="t" x="56" y="683">7. The tool asks where the Excel files should go.</text>

  <!-- Three answers to question 7 -->
  <path class="line" d="M280,700 V712 M118,712 H442 M118,712 V722 M280,712 V722 M442,712 V722"/>
  <path class="line" d="M118,712 V722" marker-end="url(#arrow)"/>
  <path class="line" d="M280,712 V722" marker-end="url(#arrow)"/>
  <path class="line" d="M442,712 V722" marker-end="url(#arrow)"/>

  <rect id="a1" class="answer" x="40" y="724" width="156" height="96" rx="8"/>
  <text class="ts" text-anchor="middle" x="118" y="748">The same bucket,<tspan x="118" dy="17">in a different</tspan><tspan x="118" dy="17">folder.</tspan></text>
  <rect id="a2" class="answer" x="202" y="724" width="156" height="96" rx="8"/>
  <text class="ts" text-anchor="middle" x="280" y="748">Another bucket<tspan x="280" dy="17">in the same</tspan><tspan x="280" dy="17">account.</tspan></text>
  <rect id="a3" class="answer" x="364" y="724" width="156" height="96" rx="8"/>
  <text class="ts" text-anchor="middle" x="442" y="748">A bucket in<tspan x="442" dy="17">another account.</tspan><tspan x="442" dy="17">You pick a</tspan><tspan x="442" dy="17">second profile.</tspan></text>

  <path class="line" d="M118,820 V832 M280,820 V832 M442,820 V832 M118,832 H442"/>
  <path class="line" d="M280,832 V846" marker-end="url(#arrow)"/>

  <rect id="s8" class="step" x="40" y="848" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="874">8. You pick the destination folder, check the summary,<tspan x="56" dy="20">and confirm that the conversion should start.</tspan></text>
  <path class="line" d="M280,912 V962" marker-end="url(#arrow)"/>

  <!-- The loop that runs once per chosen file -->
  <rect class="loop" x="24" y="920" width="540" height="484" rx="12"/>
  <text x="40" y="938" class="section">STEPS 9 TO 12 REPEAT<tspan x="40" dy="15">FOR EACH FILE YOU CHOSE</tspan></text>

  <rect id="s9" class="step" x="40" y="964" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="990">9. The tool downloads the file from the source<tspan x="56" dy="20">bucket with the source profile.</tspan></text>
  <path class="line" d="M280,1028 V1050" marker-end="url(#arrow)"/>

  <rect id="s10" class="step" x="40" y="1052" width="480" height="84" rx="8"/>
  <text class="t" x="56" y="1078">10. The tool converts the file to Excel on your<tspan x="56" dy="20">computer. The header row is bold and has filters,</tspan><tspan x="56" dy="20">costs become Excel numbers, and IDs stay text.</tspan></text>
  <path class="line" d="M280,1136 V1158" marker-end="url(#arrow)"/>

  <rect id="q11" class="question" x="40" y="1160" width="480" height="44" rx="8"/>
  <text class="t" x="56" y="1187">11. Is there already an Excel file with this name?</text>

  <path class="line" d="M280,1204 V1226" marker-end="url(#arrow)"/>
  <text class="ts" x="290" y="1220" font-weight="600" fill="#b45309">Yes</text>

  <rect id="yes" class="answer" x="40" y="1228" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="1254">You choose to overwrite that file, skip this source file,<tspan x="56" dy="20">or save the new file with the date and time added.</tspan></text>
  <path class="line" d="M280,1292 V1314" marker-end="url(#arrow)"/>

  <path class="line" d="M520,1182 H542 V1332 H522" marker-end="url(#arrow)"/>
  <text class="ts" x="527" y="1174" font-weight="600" fill="#b45309">No</text>

  <rect id="s12" class="step" x="40" y="1316" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="1342">12. The tool uploads the workbook to the destination<tspan x="56" dy="20">folder with the destination profile.</tspan></text>
  <path class="line" d="M280,1380 V1426" marker-end="url(#arrow)"/>

  <rect id="s13" class="step" x="40" y="1428" width="480" height="64" rx="8"/>
  <text class="t" x="56" y="1454">13. The tool prints how many files were converted,<tspan x="56" dy="20">skipped, and failed. The source files are never changed.</tspan></text>

  <!-- ================= Right column: AWS accounts and buckets ================= -->
  <rect id="src-account" class="account" x="640" y="140" width="370" height="424" rx="12"/>
  <text class="h" x="656" y="166">Source AWS account</text>
  <text class="note" x="656" y="186">The tool reads this account with the source profile.</text>

  <rect id="src-bucket" class="bucket" x="656" y="200" width="338" height="348" rx="10"/>
  <text class="hb" x="672" y="224">Source bucket</text>
  <rect id="src-folder" class="folder" x="672" y="238" width="306" height="182" rx="8"/>
  <text class="ts" font-weight="600" x="688" y="262">Source folder</text>
  <rect class="chip" x="688" y="276" width="274" height="28" rx="6"/>
  <text class="mono" x="700" y="295">cur2-export-00001.snappy.parquet</text>
  <rect class="chip" x="688" y="312" width="274" height="28" rx="6"/>
  <text class="ts" x="700" y="331">Any other CSV or Parquet files</text>
  <text class="note" x="688" y="372">The tool lists only the CSV and Parquet<tspan x="688" dy="18">files directly inside this folder. Files in</tspan><tspan x="688" dy="18">subfolders and other file types are ignored.</tspan></text>
  <text class="note" x="672" y="452">The tool finds the bucket's AWS Region by<tspan x="672" dy="18">itself and checks that the profile may list</tspan><tspan x="672" dy="18">the bucket before it goes any further.</tspan></text>

  <rect id="dst-account" class="account" x="640" y="1060" width="370" height="336" rx="12"/>
  <text class="h" x="656" y="1086">Destination AWS account</text>
  <text class="note" x="656" y="1106">This is the source account, unless you chose<tspan x="656" dy="17">a bucket in another account in step 7.</tspan></text>

  <rect id="dst-bucket" class="bucket" x="656" y="1140" width="338" height="240" rx="10"/>
  <text class="hb" x="672" y="1164">Destination bucket</text>
  <rect id="dst-folder" class="folder" x="672" y="1178" width="306" height="122" rx="8"/>
  <text class="ts" font-weight="600" x="688" y="1202">Destination folder</text>
  <rect class="chip" x="688" y="1216" width="274" height="28" rx="6"/>
  <text class="mono" x="700" y="1235">cur2-export-00001.xlsx</text>
  <text class="note" x="688" y="1276">Each workbook has one sheet, which is<tspan x="688" dy="18">named after its source file.</tspan></text>
  <text class="note" x="672" y="1322">Uploaded workbooks use the bucket's<tspan x="672" dy="18">default encryption setting.</tspan></text>

  <!-- ================= Data movement between the steps and the buckets ================= -->
  <path class="data" d="M520,236 H654" marker-end="url(#arrow)"/>
  <path class="data" d="M520,532 H654" marker-end="url(#arrow)"/>
  <path class="data" d="M740,548 V996 H522" marker-end="url(#arrow)"/>
  <path class="data" d="M520,1368 H654" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text class="note" x="640" y="1444">Blue boxes are steps, and amber boxes are<tspan x="640" dy="18">questions the tool asks. Gray boxes are your</tspan><tspan x="640" dy="18">possible answers. Orange arrows show files and</tspan><tspan x="640" dy="18">file lists moving between your computer and S3.</tspan></text>

  <!-- Footer, updated by scripts/stamp_docs.py -->
  <line x1="40" y1="1530" x2="1000" y2="1530" stroke="#cbd5e1" stroke-width="1"/>
  <text id="document-footer" x="40" y="1556" class="note">Internal use only. Version: 0.1.0-alpha.23. Last modified: 2026-11-19 14:27 EST. Modified by: mbitar.</text>
</svg>
